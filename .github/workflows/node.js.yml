name: YouTube Subscription Organizer CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ytso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci
        env:
          HUSKY: "0"
      - run: npm run lint
      - run: npm test
      - run: npm run test:deploy
      - run: npm run build
      - name: Verify browser flows
        run: npm run test:ui
        env:
          QA_OUTPUT_DIR: ${{ runner.temp }}/ytso-browser-qa
      - name: Verify production PWA and update lifecycle
        run: npm run test:pwa
        env:
          QA_OUTPUT_DIR: ${{ runner.temp }}/ytso-browser-qa/pwa
      - name: Save browser diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: ${{ runner.temp }}/ytso-browser-qa
          if-no-files-found: ignore
          retention-days: 7
      - name: Package verified application
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > release-id.txt
          tar -czf ytso-release.tar.gz dist server database scripts package.json package-lock.json release-id.txt
          sha256sum ytso-release.tar.gz > ytso-release.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: ytso-release
          path: |
            ytso-release.tar.gz
            ytso-release.tar.gz.sha256
          retention-days: 7

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: ytso-production-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: ytso-release
          path: ${{ runner.temp }}/ytso-artifact
      - name: Transfer verified release and monitor host activation
        run: node scripts/ssh-deploy.mjs
        env:
          YTSO_ARTIFACT_DIR: ${{ runner.temp }}/ytso-artifact
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}
          DEPLOY_BASE_DIR: ${{ vars.DEPLOY_BASE_DIR }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          jwtPrivateKey: ${{ secrets.jwtPrivateKey }}
          db: ${{ secrets.db }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PORT: ${{ secrets.PORT || '3000' }}
          TRUST_PROXY_HOPS: ${{ vars.TRUST_PROXY_HOPS || '0' }}
